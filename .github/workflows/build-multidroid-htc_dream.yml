name: Build HTC Dream device for QEMU-MultiDroid

on:
    push:
        branches:
            - htc-dream
    workflow_dispatch:

jobs:
    build:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - name: Prepare machine for build
            run: |
                sudo apt-get update
                sudo apt-get install -y build-essential ninja-build pkg-config libglib2.0-dev libpixman-1-dev zlib1g-dev libgcrypt20-dev

            - name: Configuring build
            run: |
                mkdir build && cd build
                ../configure --target-list=arm-softmmu --disable-werror

            - name: Build
            run: |
                cd build
                make -j$(nproc)

            - name: Deploy
            uses: actions/upload-artifact@v4
            with:
                name: qemu-system-arm
                path: build/qemu-system-arm
